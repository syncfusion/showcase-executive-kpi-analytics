<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="%BASE_URL%brand/syncfusion.ico" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Executive KPI and business analytics portal." />
    <link rel="preconnect" href="https://cdn.syncfusion.com" crossorigin />
    <title>Executive Analytics</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('executive-kpi-analytics:theme') === 'dark' ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <script vite-ignore src="/executive-kpi-analytics/react/pagevisit.js"></script>
    <!-- startup-preload -->
    <style>
      :root { --boot-bg: #f6f8fb; --boot-surface: #fff; --boot-text: #172033; --boot-muted: #667085; --boot-border: #e5e9f0; --boot-brand: #175cd3; --boot-soft: #eef4ff; }
      :root[data-theme='dark'] { --boot-bg: #0f172a; --boot-surface: #111827; --boot-text: #e5e7eb; --boot-muted: #94a3b8; --boot-border: #334155; --boot-brand: #93c5fd; --boot-soft: #172554; }
      html, body { margin: 0; min-width: 320px; background: var(--boot-bg); }
      #app-boot { position: fixed; inset: 0; z-index: 1000; display: flex; color: var(--boot-text); background: var(--boot-bg); font: 400 14px/1.4 Inter, ui-sans-serif, system-ui, sans-serif; }
      .boot-side { display: flex; flex: 0 0 240px; flex-direction: column; gap: 20px; padding: 20px 12px; box-sizing: border-box; background: var(--boot-surface); border-right: 1px solid var(--boot-border); }
      .boot-brand { display: flex; align-items: center; gap: 10px; }
      .boot-logo { display: grid; width: 40px; height: 40px; place-items: center; color: #fff; background: var(--boot-brand); border-radius: 8px; font-weight: 800; }
      .boot-brand strong, .boot-brand small { display: block; }
      .boot-brand small, .boot-footer { color: var(--boot-muted); font-size: 12px; }
      .boot-links { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; color: var(--boot-muted); }
      .boot-links li { height: 40px; padding: 0 10px; display: flex; align-items: center; border-radius: 7px; }
      .boot-links .current { color: var(--boot-brand); background: var(--boot-soft); font-weight: 700; }
      .boot-footer { margin-top: auto; }
      .boot-work { flex: 1; min-width: 0; }
      .boot-header { display: flex; align-items: center; height: 64px; padding: 0 20px; background: var(--boot-surface); border-bottom: 1px solid var(--boot-border); }
      .boot-main { display: grid; min-height: 240px; place-items: center; padding: 24px; color: var(--boot-muted); }
      .boot-loading { display: flex; align-items: center; gap: 12px; font-weight: 600; }
      .boot-ring { width: 24px; height: 24px; border: 3px solid var(--boot-border); border-top-color: var(--boot-brand); border-radius: 50%; animation: boot-spin .8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (max-width: 1023.98px) { .boot-side { display: none; } .boot-main { padding: 16px; } }
      @media (prefers-reduced-motion: reduce) { .boot-ring { animation: none; } }
    </style>
  </head>
  <body>
    <div id="app-boot" aria-busy="true">
      <aside class="boot-side" aria-hidden="true">
        <div class="boot-brand"><span class="boot-logo">EA</span><span><strong>EXECUTIVE</strong><small>Analytics workspace</small></span></div>
        <ul class="boot-links"><li class="current">Overview</li><li>KPI Drilldowns</li><li>Pivot Analytics</li><li>Regional Performance</li><li>AI Insights</li></ul>
        <span class="boot-footer">SYNTHETIC DATA</span>
      </aside>
      <div class="boot-work"><header class="boot-header"><strong>Executive Analytics / Overview</strong></header><main class="boot-main"><div class="boot-loading" role="status"><span class="boot-ring" aria-hidden="true"></span><span>Loading Overview…</span></div></main></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
